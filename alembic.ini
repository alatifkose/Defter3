# DEFTERIKI Alembic yapılandırması (Aşama 4.1).
#
# Veritabanı adresi bilerek burada yoktur: yol yalnız merkezi ayarlardan
# (defteriki.ayarlar, ortam değişkenleri) gelir; alembic/env.py oradan okur.
# Kişisel yol bu dosyaya yazılmaz. Göç çalıştırma açık bir işlemdir:
#
#     uv run alembic upgrade head
#
# Günlük yapılandırması yoktur (env.py fileConfig çağırmaz); Alembic'in
# kendi kayıtları stdout'a düşmez.

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os
timezone = UTC
