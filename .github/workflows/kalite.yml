name: Kalite

on:
  push:
    branches:
      - yeniden-insa
  pull_request:
    branches:
      - yeniden-insa

permissions:
  contents: read

jobs:
  kalite:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v6

      - name: uv kur
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Python kur
        run: uv python install

      - name: Bağımlılıkları kur
        run: uv sync --locked

      - name: Kalite kapısını çalıştır
        run: uv run python scripts/kontrol.py
