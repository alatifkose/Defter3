# DEFTERIKI kalite kapısı: her push ve pull request'te aynı kontrol çalışır.
#
# Yerelde commit öncesi pre-commit kancası `scripts/kontrol.py` çalıştırır;
# bu iş akışı aynı betiği uzakta çalıştırır, böylece yeşil koşu depoya bakan
# herkes için görünür olur (2026-09-20 bağımsız denetimi).
#
# Ürün hedefi Windows masaüstü olduğu için koşu `windows-latest` üzerindedir.
# Simgesel bağlantı gerektiren testler yetki yoksa kendiliğinden atlanır.
name: kontrol

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: uv kur
        run: pip install uv

      - name: Bağımlılıkları kilitten kur
        run: uv sync --frozen

      - name: Biçim, statik kontrol, tip kontrolü ve testler
        run: uv run python scripts/kontrol.py
